name: tests

on:
  push:
    branches: [main]
    # A tag is the shipping moment, so the suite runs on it too. The tag-pairing check in
    # tests/run.sh only activates when HEAD sits exactly on a tag, which is what this trigger
    # provides: a v0.4.0 whose plugin.json, README pin or changelog heading disagrees goes red
    # minutes after the push, instead of shipping mismatched and being found by a user.
    tags: ['v*']
  pull_request:

jobs:
  test:
    # ubuntu matters as much as macos here: everything in this kit was developed
    # on macOS, and the accessors it wraps are undocumented internals whose paths
    # and shell behaviour differ between the two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Without the tags, `git describe --tags --exact-match` finds nothing on the
          # runner's shallow clone and the tag-pairing check skips itself on the one run
          # that exists to execute it. Passing by silence, so the fetch is not optional.
          fetch-tags: true

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq zsh
          else
            # macOS ships jq on GitHub runners and zsh in the base image.
            command -v jq  >/dev/null || brew install jq
            command -v zsh >/dev/null || brew install zsh
          fi

      - name: Versions
        run: |
          bash --version | head -1
          zsh --version
          jq --version

      # The suite builds its own $HOME under mktemp and never reads the real one,
      # so it is safe on a runner that has no ~/.claude at all.
      - name: Run tests
        run: bash tests/run.sh

      # Run the WHOLE suite under zsh, not just a sourcing smoke check.
      #
      # An earlier version only verified that the library could be sourced from zsh.
      # It passed while cs_find, cs_list and cs_pid_file were all completely broken
      # there, because zsh treats an unmatched glob as a fatal error where bash
      # expands it to a literal. Checking "it loads" proves nothing about "it works".
      - name: Run tests under zsh
        run: zsh tests/run.sh

      # Needs the real claude CLI, which a runner does not have, so it skips itself with
      # exit 0. Wired in anyway: the day a runner image ships the CLI, this starts covering
      # the platform assumptions in INTERNALS O16-O22 without anyone remembering to add it.
      - name: Plugin integration (skips without the CLI)
        run: bash tests/integration-plugin.sh

      # One prefix through the whole lifecycle: install, install again, then uninstall.
      # Separate prefixes per assertion only proved each step works from clean.
      - name: Installer round-trip
        run: |
          export CLAUDE_SESSION_KIT_PREFIX="$RUNNER_TEMP/claude"
          ./install.sh
          ./install.sh                     # second run must be a no-op, not an error
          test -r "$CLAUDE_SESSION_KIT_PREFIX/session-kit/core/sessions.sh"

          # Skills come from the plugin now. A copy here would register under its bare,
          # un-namespaced name and shadow the plugin's, so the installer must write none.
          test ! -e "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session"
          test ! -e "$CLAUDE_SESSION_KIT_PREFIX/skills/session-note"
          test ! -e "$CLAUDE_SESSION_KIT_PREFIX/skills/handoff"
          test -x "$CLAUDE_SESSION_KIT_PREFIX/session-kit/hooks/session-note.sh"
          test -x "$CLAUDE_SESSION_KIT_PREFIX/session-kit/hooks/session-guard.sh"
          test -x "$CLAUDE_SESSION_KIT_PREFIX/session-kit/hooks/session-drift.sh"
          test -x "$CLAUDE_SESSION_KIT_PREFIX/session-kit/handoff/import.sh"
          test -x "$CLAUDE_SESSION_KIT_PREFIX/session-kit/handoff/release.sh"

          # The version guard tells people to run this, so it has to be installed,
          # and it has to still locate core/ from its installed location.
          test -r "$CLAUDE_SESSION_KIT_PREFIX/session-kit/tests/smoke.sh"
          bash "$CLAUDE_SESSION_KIT_PREFIX/session-kit/tests/smoke.sh"

          # A relative source ships a skill that silently cannot find its libraries.
          # Checked against the repo, which is the only copy there is: the plugin ships
          # these files verbatim. Pointing this at an install prefix would make grep fail
          # on missing files, and the leading ! would read that error as a pass.
          ! grep -qE '^\. (core|naming|notes)/|^handoff/' \
            skills/rename-session/SKILL.md \
            skills/session-note/SKILL.md \
            skills/handoff/SKILL.md

          # A bare copy an older version of the installer wrote carries the session-kit
          # marker in its absolute library paths, so it is recognisable as ours and a
          # re-run retires it.
          mkdir -p "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session"
          cp skills/rename-session/SKILL.md \
             "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session/SKILL.md"
          ./install.sh
          test ! -e "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session"

          ./install.sh --uninstall
          test ! -d "$CLAUDE_SESSION_KIT_PREFIX/session-kit"

      # A skill dir the user already owned must never be touched. It used to make the
      # install refuse outright; now that nothing is written there, refusing would block
      # an install over a file that is merely in the way, so the run warns and continues
      # and the foreign content survives either way.
      - name: Installer leaves a foreign skill alone
        run: |
          export CLAUDE_SESSION_KIT_PREFIX="$RUNNER_TEMP/claude-foreign"
          mkdir -p "$CLAUDE_SESSION_KIT_PREFIX/skills/session-note"
          echo "someone elses skill" > "$CLAUDE_SESSION_KIT_PREFIX/skills/session-note/SKILL.md"
          OUT=$(./install.sh 2>&1)
          grep -q "someone elses skill" "$CLAUDE_SESSION_KIT_PREFIX/skills/session-note/SKILL.md"
          printf '%s' "$OUT" | grep -q "shadows the plugin"

      # Not a gate: it needs a real ~/.claude and a runner has none, so it skips here.
      # Running it proves the skip path stays healthy.
      - name: Smoke test (skips without ~/.claude)
        run: bash tests/smoke.sh
