name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu matters as much as macos here: everything in this kit was developed
    # on macOS, and the accessors it wraps are undocumented internals whose paths
    # and shell behaviour differ between the two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq zsh
          else
            # macOS ships jq on GitHub runners and zsh in the base image.
            command -v jq  >/dev/null || brew install jq
            command -v zsh >/dev/null || brew install zsh
          fi

      - name: Versions
        run: |
          bash --version | head -1
          zsh --version
          jq --version

      # The suite builds its own $HOME under mktemp and never reads the real one,
      # so it is safe on a runner that has no ~/.claude at all.
      - name: Run tests
        run: bash tests/run.sh

      # Run the WHOLE suite under zsh, not just a sourcing smoke check.
      #
      # An earlier version only verified that the library could be sourced from zsh.
      # It passed while cs_find, cs_list and cs_pid_file were all completely broken
      # there, because zsh treats an unmatched glob as a fatal error where bash
      # expands it to a literal. Checking "it loads" proves nothing about "it works".
      - name: Run tests under zsh
        run: zsh tests/run.sh

      # One prefix through the whole lifecycle: install, install again, then uninstall.
      # Separate prefixes per assertion only proved each step works from clean.
      - name: Installer round-trip
        run: |
          export CLAUDE_SESSION_KIT_PREFIX="$RUNNER_TEMP/claude"
          ./install.sh
          ./install.sh                     # second run must be a no-op, not an error
          test -r "$CLAUDE_SESSION_KIT_PREFIX/session-kit/core/sessions.sh"
          test -r "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session/SKILL.md"

          # The version guard tells people to run this, so it has to be installed,
          # and it has to still locate core/ from its installed location.
          test -r "$CLAUDE_SESSION_KIT_PREFIX/session-kit/tests/smoke.sh"
          bash "$CLAUDE_SESSION_KIT_PREFIX/session-kit/tests/smoke.sh"

          # A missed rewrite installs a skill that silently cannot find its libraries.
          ! grep -qE '^\. (core|naming)/' \
            "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session/SKILL.md"

          ./install.sh --uninstall
          test ! -d "$CLAUDE_SESSION_KIT_PREFIX/session-kit"
          test ! -d "$CLAUDE_SESSION_KIT_PREFIX/skills/rename-session"

      # Not a gate: it needs a real ~/.claude and a runner has none, so it skips here.
      # Running it proves the skip path stays healthy.
      - name: Smoke test (skips without ~/.claude)
        run: bash tests/smoke.sh
